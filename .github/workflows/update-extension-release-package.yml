name: Update Extension Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Used for the tag (v1.0.0) and zip filename.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # INFURA_PROJECT_ID is the only variable declared without a default in
      # builds.yml that the dist build actually accesses. All other env vars
      # either have defaults or are not read during a 'yarn build dist' run.
      INFURA_PROJECT_ID: ''
      TZ: 'UTC'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Uses the same build command as main.yml's build-dist-browserify job.
      # 'yarn build dist' produces builds/metamask-chrome-<version>.zip automatically.
      - name: Run build
        run: yarn build dist

      - name: Validate source maps
        run: yarn validate-source-maps

      - name: Locate Chrome zip
        id: find-zip
        run: |
          ZIP=$(ls builds/metamask-chrome-*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No metamask-chrome-*.zip found in builds/"
            ls -la builds/
            exit 1
          fi
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP ($(stat --format=%s "$ZIP") bytes)"

      - name: Rename zip to match release version
        run: |
          cp "${{ steps.find-zip.outputs.zip_path }}" "metamask-chrome-${{ inputs.version }}.zip"
          echo "Created metamask-chrome-${{ inputs.version }}.zip"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          ZIP="metamask-chrome-${{ inputs.version }}.zip"

          echo "Tag: $TAG"
          echo "Asset: $ZIP ($(stat --format=%s "$ZIP") bytes)"
          echo ""

          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading asset (overwriting if present)..."
            gh release upload "$TAG" "$ZIP" --clobber --repo "${{ github.repository }}"
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$ZIP" \
              --repo "${{ github.repository }}" \
              --title "Version ${{ inputs.version }}" \
              --notes "MetaMask Chrome extension v${{ inputs.version }}" \
              --target "${{ github.sha }}"
          fi

          echo ""
          echo "Release URL:"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url --jq '.url'
